<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAR Global & Wasalt Assistant</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--fg:#1c1c1a;--mut:#6b6b66;--acc:#1f5f4a;--bd:#e3e3de;--me:#1f5f4a;--mefg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#171715;--card:#222220;--fg:#ececE8;--mut:#9a9a94;--acc:#6fcfae;--bd:#34342f;--me:#2d6b57;--mefg:#fff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;max-width:780px;margin:auto}
header{padding:18px 16px 8px}h1{font-size:18px;margin:0}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
#log{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:12px;background:var(--card);border:1px solid var(--bd);overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--me);color:var(--mefg);border-color:transparent}
.src{margin-top:8px;font-size:12px;color:var(--mut)}.src a{color:var(--acc);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}.chips button{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 16px 16px}input{flex:1;padding:11px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}
button.send{background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}button:disabled{opacity:.5}
</style></head><body>
<header><h1>DAR Global &amp; Wasalt Assistant</h1><p>Answers come from the companies' public websites.</p></header>
<div id="log"></div>
<div class="chips" id="chips"></div>
<form id="f"><input id="q" placeholder="Ask about DAR Global or Wasalt…" autocomplete="off" maxlength="500"><button class="send" id="b">Send</button></form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),b=document.getElementById('b');let hist=[];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*[-*] /gm,'• ').replace(/\n/g,'<br>');
function render(d,t,src){d.innerHTML=md(t);
 if(src&&src.length){const s=document.createElement('div');s.className='src';s.innerHTML='Sources'+src.filter(x=>/^https?:/.test(x.url)).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`).join('');d.appendChild(s)}
 log.scrollTop=log.scrollHeight}
function add(t,cls,src){const d=document.createElement('div');d.className='m '+cls;render(d,t,src);log.appendChild(d);return d}
async function ask(text){add(text,'u');hist.push({role:'user',content:text});b.disabled=true;
 const w=add('Thinking…','a');let acc='',srcs=[];
 try{const r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist.slice(-10)})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.detail||'Error '+r.status)}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){const {done,value}=await rd.read();if(done)break;
   buf+=dec.decode(value,{stream:true});const parts=buf.split('\n\n');buf=parts.pop();
   for(const p of parts){if(!p.startsWith('data: '))continue;const e=JSON.parse(p.slice(6));
    if(e.error)throw new Error(e.error);if(e.sources)srcs=e.sources;
    if(e.delta){acc+=e.delta;render(w,acc,srcs)}}}
  if(!acc)throw new Error('No response');render(w,acc,srcs);hist.push({role:'assistant',content:acc})}
 catch(e){w.remove();hist.pop();add('Sorry, something went wrong: '+e.message,'a')}
 b.disabled=false;q.focus()}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=q.value.trim();if(t){q.value='';ask(t)}};
['What does DAR Global do?','What is Wasalt?','Which projects does DAR Global have?','What services does Wasalt offer?'].forEach(t=>{const c=document.createElement('button');c.textContent=t;c.onclick=()=>ask(t);document.getElementById('chips').appendChild(c)});
add('Hi! Ask me anything about DAR Global or Wasalt.','a');
</script></body></html>
